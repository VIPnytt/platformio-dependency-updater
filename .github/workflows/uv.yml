name: uv

on:
  merge_group:
    types:
      - checks_requested

  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  uv-lock:
    name: Lock
    runs-on: ubuntu-slim

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: 3.12
          version: latest-known

      - name: uv lock
        run: uv lock --check
